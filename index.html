        restaurants.forEach((r) => places.push({ ...r, day: "food" }));
        cafes.forEach((c) => places.push({ ...c, day: "cafe" }));

        const map = L.map("map").setView([35.8322, 129.2190], 16);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const layers = { 1: L.layerGroup(), 2: L.layerGroup(), 3: L.layerGroup(), food: L.layerGroup(), cafe: L.layerGroup() };
        const list = document.getElementById("list");
        const counters = { 1: 0, 2: 0, 3: 0, food: 0, cafe: 0 };
        const groupHeaders = {};

        const preview = document.getElementById("hover-preview");
        const previewImg = preview.querySelector("img");

        function ratingText(p) {
            if (!p.rating) return "";
            return `★ ${p.rating} (카카오맵 후기 ${p.reviews})`;
        }

        function memoText(p) {
            if (p.day !== "food" && p.day !== "cafe") return p.memo;
            return [`메뉴: ${p.menu}`, p.hours ? `영업: ${p.hours}` : "", p.note].filter(Boolean).join(" / ");
        }

        places.forEach((p) => {
            const color = COLORS[p.day];
            const isFood = p.day === "food";
            const isSpot = p.day === "food" || p.day === "cafe";
            const hasCoord = p.lat !== null;
            if (hasCoord) counters[p.day] += 1;
            const n = hasCoord ? counters[p.day] : "–";
            const imgSrc = p.img ? IMAGES[p.img] : null;

            if (!groupHeaders[p.day]) {
                const h = document.createElement("div");
                h.className = "day-title";
                h.dataset.day = p.day;
                h.style.borderColor = isFood ? "#E0B800" : color;
                h.innerText = GROUP_TITLES[p.day];
                list.appendChild(h);
                groupHeaders[p.day] = h;
            }

            let marker = null;
            if (hasCoord) {
                marker = L.marker([p.lat, p.lon], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="pin${isFood ? " food" : ""}" style="background:${color}">${n}</div>`,
                        iconSize: [22, 22],
                        iconAnchor: [11, 11],
                        popupAnchor: [0, -12]
                    })
                });

                const title = isSpot ? `${p.name}` : `${GROUP_TITLES[p.day]} ${n}. ${p.name}`;
                const rating = ratingText(p);
                marker.bindPopup(
                    `<b>${title}</b>` +
                    (rating ? `<br><span class="rating">${rating}</span>` : "") +
                    `<br>${memoText(p)}` +
                    (p.check ? `<br><span class="check">⚠ 체크: ${p.check}</span>` : "") +
                    (p.address ? `<br><span style="color:#777">${p.address}</span>` : "") +
                    (p.kakao ? `<br><a href="${p.kakao}" target="_blank" rel="noopener">카카오맵에서 보기</a>` : "") +
                    (imgSrc ? `<img class="popup-img" src="${imgSrc}" alt="${p.name}">` : "")
                );

                // 마우스를 올리면 사진 표시
                if (imgSrc) {
                    marker.bindTooltip(
                        `<img src="${imgSrc}" alt="${p.name}"><b>${p.name}</b>${rating ? `<br><span class="rating">${rating}</span>` : ""}`,
                        { direction: "top", offset: [0, -12], className: "photo-tip", opacity: 1 }
                    );
                }
                layers[p.day].addLayer(marker);
            }

            const div = document.createElement("div");
            div.className = "restaurant" + (hasCoord ? "" : " disabled");
            div.dataset.day = p.day;

            const nameDiv = document.createElement("div");
            nameDiv.className = "restaurant-name";
            nameDiv.innerText = `${n}. ${p.name}`;
            nameDiv.style.color = isFood ? "#9A7400" : color;
            div.appendChild(nameDiv);

            const rating = ratingText(p);
            if (rating) {
                const ratingDiv = document.createElement("div");
                ratingDiv.className = "rating";
                ratingDiv.innerText = rating;
                div.appendChild(ratingDiv);
            }

            const menuDiv = document.createElement("div");
            menuDiv.className = "restaurant-menu";
            menuDiv.innerText = memoText(p);
            div.appendChild(menuDiv);

            if (p.check) {
                const checkDiv = document.createElement("div");
                checkDiv.className = "check";
                checkDiv.innerText = `⚠ 체크: ${p.check}`;
                div.appendChild(checkDiv);
            }

            // 목록에 마우스를 올려도 사진 미리보기
            if (imgSrc) {
                div.addEventListener("mouseenter", () => {
                    previewImg.src = imgSrc;
                    preview.style.display = "block";
                });
                div.addEventListener("mousemove", (e) => {
                    preview.style.left = `${e.clientX + 16}px`;
                    const top = Math.min(e.clientY + 16, window.innerHeight - preview.offsetHeight - 8);
                    preview.style.top = `${Math.max(top, 8)}px`;
                });
                div.addEventListener("mouseleave", () => {
                    preview.style.display = "none";
                });
            }

            if (marker) {
                div.addEventListener("click", () => {
                    if (!map.hasLayer(layers[p.day])) layers[p.day].addTo(map);
                    preview.style.display = "none";
                    map.setView([p.lat, p.lon], 16);
                    marker.openPopup();
                });
            }
            list.appendChild(div);
        });

        // 2일차 산책 코스 연결선 (월정교 → 첨성대, 순서 표시용 직선)
        const walkLine = places.filter((p) => p.walk).map((p) => [p.lat, p.lon]);
        L.polyline(walkLine, { color: COLORS[2], weight: 3, dashArray: "6 6", opacity: 0.8 }).addTo(layers[2]);

        Object.values(layers).forEach((l) => l.addTo(map));

        function showDay(day) {
            document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.day === day));
            document.querySelectorAll("#list [data-day]").forEach((el) => {
                el.style.display = day === "all" || el.dataset.day === day ? "" : "none";
            });

            const bounds = [];
            Object.entries(layers).forEach(([d, layer]) => {
                const visible = day === "all" || d === day;
                if (visible) {
                    layer.addTo(map);
                    places.filter((p) => String(p.day) === d && p.lat !== null).forEach((p) => bounds.push([p.lat, p.lon]));
                } else {
                    map.removeLayer(layer);
                }
            });
            if (day !== "all" && bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 17 });
        }

        document.querySelectorAll(".tab").forEach((t) => {
            t.addEventListener("click", () => showDay(t.dataset.day));
        });

        // 임베드 영역 크기가 늦게 잡히는 경우 타일이 비어 보이지 않도록 재계산
        window.addEventListener("load", () => map.invalidateSize());
        window.addEventListener("resize", () => map.invalidateSize());
        setTimeout(() => map.invalidateSize(), 500);
    </script>
</body>
</html>
